[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-fit-v6-imputation-py"
version = "0.1.0"
description = "Standalone federated imputation algorithm for STRATA-FIT v6."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.4",
    "pydantic>=2.5.3",
    "pyarrow>=22.0.0",
    "requests>=2.31.0",
    "PyJWT>=2.8.0",
    "scikit-learn>=1.3.0",
    "v6-federated-algo-core-py @ https://github.com/mdw-nl/v6-federated-algo-core-v6/archive/c29dd63f40c6e3997a0865cb0cbc81dd9ce02a60.tar.gz",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "vantage6-client>=4.13.3",
]

[project.entry-points."run_context"]
central = "strata_fit_v6_imputation_py.central:central"
partial_compute = "strata_fit_v6_imputation_py.partial:partial_compute"
get_local_sums = "strata_fit_v6_imputation_py.partial:get_local_sums"

[project.scripts]
strata-fit-v6-imputation-dispatch = "strata_fit_v6_imputation_py.container:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["strata_fit_v6_imputation_py*"]
